# Local Render-shaped smoke test (Docker Desktop).
# Usage:
#   docker compose -f docker-compose.render.yml up --build
# Then open http://127.0.0.1:10000/
#
# /data persists across restarts like Render's disk (XGB pickle cache, served pages).
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile.render
    ports:
      - "10000:10000"
    # Match Render budget (2 GB / 1 CPU). Docker Desktop VM RAM is separate.
    mem_limit: 2g
    cpus: 1.0
    environment:
      PORT: "10000"
      RENDER: "1"
      PL_EAGER_WARM: "0"
      PL_WEB_WARM: "0"
      # Short grace locally so cards start; master stamp stops recycle re-arm.
      PL_BOOT_GRACE_S: "${PL_BOOT_GRACE_S:-30}"
      PL_BUILD_SLOTS: "1"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_MAX_REQUESTS: "${GUNICORN_MAX_REQUESTS:-5000}"
      GUNICORN_MAX_REQUESTS_JITTER: "${GUNICORN_MAX_REQUESTS_JITTER:-100}"
      # Heavy background jobs off for local smoke (props was blowing past 512MB jobs).
      PL_PROP_PUBLICATION: "0"
      PL_PROP_SETTLEMENT: "0"
      PL_PROPS_PRELOAD: "0"
      PL_SHARE_IMAGES: "0"
      PL_AUTOREFRESH: "0"
      PRICE_SNAPSHOTS: "0"
      # Keep ladder picks publishing; pass still runs every 20 min.
      LADDER_SCHEDULER: "1"
      # Optional: point at real secrets if you need login/paywall locally
      # DATABASE: /data/sports_predictions_original.db
    volumes:
      - pl_render_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  pl_render_data:
