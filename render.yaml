services:
  - type: web
    name: predictionlab
    runtime: python
    # Picks app must deploy even if player-props npm build fails (was blocking all picks pages).
    buildCommand: >
      pip install -r requirements.txt &&
      (pip install -r standalone-player-props/backend/requirements.txt || true) &&
      (cd standalone-player-props/frontend && npm ci && npm run build && cd ../.. || true)
    # Do not override in Render dashboard with a raw gunicorn line (drops gthread + /data DB).
    startCommand: bash render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # ── Required — set these in the Render dashboard ──────────────────
      - key: SECRET_KEY
        generateValue: true
      # In Google Cloud Console, add redirect URI for your *public* host, e.g.
      # https://predictionlab.io/auth/google/callback (not only *.onrender.com).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── Optional ──────────────────────────────────────────────────────
      - key: GA_TRACKING_ID
        sync: false
      - key: GA_PROPERTY_ID
        sync: false
      # Contact form (Gmail app password for support.predictionlab@gmail.com)
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      # Datadog APM (see docs/datadog-setup.md)
      - key: DD_API_KEY
        sync: false
      - key: DD_SITE
        sync: false
      - key: DD_SERVICE
        value: predictionlab
      - key: DD_ENV
        value: production
      - key: DD_TRACE_ENABLED
        value: "true"
      - key: DD_LOGS_INJECTION
        value: "true"
    disk:
      name: app-data
      mountPath: /data
      sizeGB: 5
