services:
  - type: web
    name: predictionlab
    runtime: python
    # Player-props frontend must not block picks-page deploys (npm failures kept site on old code).
    buildCommand: >
      pip install -r requirements.txt &&
      (pip install -r standalone-player-props/backend/requirements.txt || true) &&
      (cd standalone-player-props/frontend && npm ci && npm run build && cd ../.. || echo "[build] player-props frontend skipped")
    startCommand: bash render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # ── Required — set these in the Render dashboard ──────────────────
      - key: SECRET_KEY
        generateValue: true
      # In Google Cloud Console, add redirect URI for your *public* host, e.g.
      # https://predictionlab.io/auth/google/callback (not only *.onrender.com).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── Optional ──────────────────────────────────────────────────────
      - key: GA_TRACKING_ID
        sync: false
      - key: GA_PROPERTY_ID
        sync: false
    disk:
      name: app-data
      mountPath: /data
      sizeGB: 5
