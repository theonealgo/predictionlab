<script>
(function () {
    var account = document.querySelector('.pl2-account');
    if (account) {
        var button = account.querySelector('.pl2-account-button');
        var menu = account.querySelector('.pl2-account-menu');
        if (button && menu) {
            function closeAccountMenu() {
                menu.hidden = true;
                button.setAttribute('aria-expanded', 'false');
            }
            button.addEventListener('click', function (event) {
                event.stopPropagation();
                var opening = menu.hidden;
                menu.hidden = !opening;
                button.setAttribute('aria-expanded', opening ? 'true' : 'false');
            });
            document.addEventListener('click', function (event) {
                if (!account.contains(event.target)) closeAccountMenu();
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') closeAccountMenu();
            });
        }
    }
    var drops = Array.prototype.slice.call(document.querySelectorAll('.pl2-navdrop'));
    function closeAll(except) {
        drops.forEach(function (d) {
            if (d === except) return;
            var m = d.querySelector('.pl2-nav-menu');
            var b = d.querySelector('.pl2-nav-trigger');
            if (m) m.hidden = true;
            if (b) b.setAttribute('aria-expanded', 'false');
        });
    }
    drops.forEach(function (d) {
        var b = d.querySelector('.pl2-nav-trigger');
        var m = d.querySelector('.pl2-nav-menu');
        if (!b || !m) return;
        b.addEventListener('click', function (e) {
            e.stopPropagation();
            var opening = m.hidden;
            closeAll(d);
            m.hidden = !opening;
            b.setAttribute('aria-expanded', opening ? 'true' : 'false');
        });
    });
    document.addEventListener('click', function () { closeAll(null); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAll(null);
    });
})();
</script>
