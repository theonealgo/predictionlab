  <text x="24" y="58" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Books favorite · PL favorite · Agree / disagree</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#0f172a">
    <text x="24" y="100">Books favorite</text>
    <rect x="200" y="86" width="200" height="16" fill="#0c1e3a"/>
