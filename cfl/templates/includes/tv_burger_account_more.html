{# Burger tail: Account dropdown, then More (Blog + existing More items) #}
{% include "includes/tv_burger_auth.html" %}
<button type="button" class="tv-menu-btn" onclick="tvToggleMore(this)"><span class="tv-menu-label">More</span><span class="tv-more-arrow" style="color:#94a3b8;font-size:0.85rem;transition:transform .2s;">&#8250;</span></button>
<div id="tvMoreItems" style="display:none;padding-left:8px;border-left:2px solid #f1f5f9;margin:2px 8px 2px 14px;">
  <a href="/blog" class="tv-menu-btn" style="text-decoration:none;padding:10px 10px;"><span class="tv-menu-label" style="font-size:0.88rem;">Blog</span></a>
  <button type="button" class="tv-menu-btn" style="padding:10px 10px;" onclick="tvSub('community')"><span class="tv-menu-label" style="font-size:0.88rem;">Community</span><span class="tv-menu-arrow">&#8250;</span></button>
  <button type="button" class="tv-menu-btn" style="padding:10px 10px;" onclick="tvSub('company')"><span class="tv-menu-label" style="font-size:0.88rem;">Company</span><span class="tv-menu-arrow">&#8250;</span></button>
</div>
<script>
function tvToggleAccount(btn){
  var el=document.getElementById('tvAccountItems');
  if(!el)return;
  var open=el.style.display==='block';
  el.style.display=open?'none':'block';
  var arrow=btn.querySelector('.tv-more-arrow');
  if(arrow)arrow.style.transform=open?'':'rotate(90deg)';
}
</script>
