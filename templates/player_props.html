{% extends "base.html" %}
{% block title %}Player Props | Prediction Lab{% endblock %}
{% block head_meta %}
<meta name="description" content="AI-powered player prop projections — points, rebounds, assists, threes and steals for tonight's games.">
{% endblock %}
{% block extra_styles %}
<style>
/* ── LAYOUT ── */
.props-wrap{max-width:1440px;margin:0 auto;padding:0 16px 48px;}

/* ── CONTROLS ── */
.props-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(15,23,42,0.06);}
.controls-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.tab-group{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:2px;}
.tab-btn{background:transparent;border:none;border-radius:8px;padding:7px 18px;font-size:0.85rem;font-weight:700;color:#475569;cursor:pointer;transition:background .15s,color .15s;}
.tab-btn.active{background:#fff;color:#0f172a;box-shadow:0 1px 4px rgba(15,23,42,0.12);}
.league-sel{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;font-size:0.88rem;font-weight:600;color:#0f172a;min-width:140px;cursor:pointer;}
.load-btn{background:#2563eb;border:none;border-radius:10px;color:#fff;padding:9px 22px;font-size:0.88rem;font-weight:800;cursor:pointer;margin-left:auto;white-space:nowrap;}
.load-btn:hover{background:#1d4ed8;}
.load-btn:disabled{background:#93c5fd;cursor:default;}

/* ── DATE BUBBLES ── */
.date-bubbles-wrap{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px 16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(15,23,42,0.06);display:none;align-items:center;gap:8px;}
.date-bubbles-wrap.visible{display:flex;}
.date-nav-btn{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font-size:0.8rem;font-weight:700;cursor:pointer;color:#475569;white-space:nowrap;flex-shrink:0;}
.date-nav-btn:hover{background:#e2e8f0;}
.date-nav-btn:disabled{opacity:.35;cursor:default;}
.date-bubbles{display:flex;gap:8px;overflow-x:auto;padding:2px 0;flex:1;}
.date-bubbles::-webkit-scrollbar{height:4px;}
.date-bubbles::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
.date-bubble{background:#fff;border:2px solid rgba(15,23,42,0.18);border-radius:22px;padding:7px 14px;min-width:88px;text-align:center;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:600;font-size:0.82rem;color:#0f172a;flex-shrink:0;}
.date-bubble:hover{border-color:#2563eb;}
.date-bubble.active{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700;}
.date-bubble.today-bubble{border-color:#059669;color:#059669;}
.date-bubble.active.today-bubble{background:#059669;color:#fff;}

/* ── MESSAGES ── */
.props-msg{text-align:center;padding:48px 20px;color:#64748b;font-size:0.95rem;background:#fff;border:1px solid #E2E8F0;border-radius:14px;}
.props-error{padding:12px 16px;border-radius:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:0.88rem;margin-bottom:16px;}

/* ── PROP TYPE FILTER PILLS ── */
.prop-filter-wrap{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(15,23,42,0.05);}
.prop-filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.prop-filter-btn{background:#f8fafc;border:1.5px solid #E2E8F0;border-radius:20px;padding:5px 14px;font-size:0.8rem;font-weight:700;color:#64748b;cursor:pointer;transition:all .15s;white-space:nowrap;}
.prop-filter-btn:hover{border-color:#2563eb;color:#2563eb;}
.prop-filter-btn.active{background:#2563eb;border-color:#2563eb;color:#fff;}

/* ── TOOLBAR ── */
.props-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.pt-search{background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;padding:8px 12px;font-size:0.88rem;color:#0f172a;outline:none;min-width:160px;max-width:240px;}
.pt-search:focus{border-color:#2563eb;}
.side-filter-grp{display:flex;gap:4px;}
.side-btn{background:#f8fafc;border:1.5px solid #E2E8F0;border-radius:10px;padding:7px 14px;font-size:0.8rem;font-weight:700;color:#64748b;cursor:pointer;transition:all .15s;white-space:nowrap;}
.side-btn:hover{border-color:#2563eb;color:#2563eb;}
.side-btn.active-over{background:rgba(16,185,129,0.1);border-color:#059669;color:#059669;}
.side-btn.active-under{background:rgba(239,68,68,0.08);border-color:#dc2626;color:#dc2626;}
.side-btn.active-all{background:#2563eb;border-color:#2563eb;color:#fff;}
.pt-count{font-size:0.8rem;font-weight:700;color:#64748b;white-space:nowrap;background:#f1f5f9;border:1px solid #E2E8F0;border-radius:8px;padding:5px 10px;}
.copy-all-btn{margin-left:auto;background:#0f172a;color:#fff;border:none;border-radius:10px;padding:7px 14px;font-size:0.8rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s;}
.copy-all-btn:hover{background:#1e293b;}
.copy-all-btn.copied{background:#059669;}

/* ── TABLE WRAP ── */
.props-table-outer{overflow-x:auto;background:#fff;border:1px solid #E2E8F0;border-radius:14px;box-shadow:0 2px 12px rgba(15,23,42,0.07);}
.props-table{width:100%;border-collapse:collapse;font-size:0.76rem;min-width:860px;}

/* ── TABLE HEADER ── */
.props-table thead{position:sticky;top:0;z-index:10;background:#f8fafc;}
.props-table thead th{padding:9px 10px;text-align:left;font-size:0.6rem;font-weight:800;text-transform:uppercase;letter-spacing:0;color:#64748b;border-bottom:2px solid #E2E8F0;white-space:nowrap;cursor:pointer;user-select:none;}
.props-table thead th:hover{color:#2563eb;}
.props-table thead th.sorted-asc::after{content:" ↑";color:#2563eb;}
.props-table thead th.sorted-desc::after{content:" ↓";color:#2563eb;}
.props-table thead th.no-sort{cursor:default;}
.props-table thead th.no-sort:hover{color:#64748b;}

/* ── TABLE ROWS ── */
.props-table tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s;}
.props-table tbody tr:last-child{border-bottom:none;}
.props-table tbody tr:hover{background:#f8fafc;}
.props-table td{padding:8px 10px;vertical-align:middle;}

/* ── PLAYER CELL ── */
.td-player{display:flex;align-items:center;gap:10px;min-width:160px;}
.p-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;font-size:0.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.3px;}
.p-name{font-weight:800;color:#0f172a;font-size:0.8rem;line-height:1.2;white-space:normal;overflow-wrap:anywhere;}
.p-sub{font-size:0.66rem;color:#64748b;font-weight:600;margin-top:1px;white-space:normal;overflow-wrap:anywhere;}

/* ── PROP TYPE CELL ── */
.prop-type-tag{display:inline-block;font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:6px;background:#f1f5f9;color:#334155;white-space:nowrap;border:1px solid #E2E8F0;}

/* ── TOOLTIPS ── */
.prop-info-btn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#e2e8f0;color:#64748b;font-size:0.6rem;font-weight:800;cursor:help;border:none;padding:0;margin-left:3px;vertical-align:middle;flex-shrink:0;transition:background .15s;}
.prop-info-btn:hover{background:#2563eb;color:#fff;}
.prop-tooltip-wrap{position:relative;display:inline-flex;align-items:center;gap:0;}
.prop-tooltip-box{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:0.72rem;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:999;min-width:180px;max-width:260px;white-space:normal;line-height:1.4;pointer-events:none;}
.prop-tooltip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#0f172a;}
.prop-tooltip-wrap:hover .prop-tooltip-box{display:block;}

/* ── LINE/PROJ CELLS ── */
.td-line{font-weight:700;color:#0f172a;font-size:0.82rem;text-align:center;}
.td-proj{font-weight:800;font-size:0.84rem;text-align:center;}
.td-proj.up{color:#059669;}
.td-proj.down{color:#dc2626;}

/* ── DIFF CELL ── */
.diff-badge{display:inline-flex;align-items:center;font-size:0.82rem;font-weight:800;padding:3px 9px;border-radius:8px;white-space:nowrap;}
.diff-badge.pos{background:rgba(16,185,129,0.11);color:#059669;}
.diff-badge.neg{background:rgba(239,68,68,0.09);color:#dc2626;}
.diff-badge.neu{background:#f1f5f9;color:#64748b;}

/* ── CONFIDENCE CELL ── */
.conf-wrap{display:flex;align-items:center;gap:6px;min-width:70px;}
.conf-pct{font-weight:800;font-size:0.85rem;color:#0f172a;min-width:32px;}
.conf-bar-bg{flex:1;height:4px;background:#e2e8f0;border-radius:3px;overflow:hidden;}
.conf-bar-fg{height:100%;border-radius:3px;}
.conf-bar-fg.great{background:#059669;}
.conf-bar-fg.ok{background:#d97706;}
.conf-bar-fg.poor{background:#dc2626;}

/* ── EV CELL ── */
.ev-val{font-weight:800;font-size:0.85rem;}
.ev-val.pos{color:#059669;}
.ev-val.neg{color:#dc2626;}
.ev-val.neu{color:#94a3b8;}

/* ── HIT RATE CELLS ── */
.hr-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hr-pct{font-weight:800;font-size:0.85rem;}
.hr-pct.hot{color:#059669;}
.hr-pct.warm{color:#0f172a;}
.hr-pct.cold{color:#dc2626;}
.hr-pct.na{color:#cbd5e1;font-size:0.78rem;}
.hr-bar-bg{width:34px;height:3px;background:#e2e8f0;border-radius:2px;overflow:hidden;}
.hr-bar-fg{height:100%;border-radius:2px;}
.hr-bar-fg.hot{background:#059669;}
.hr-bar-fg.warm{background:#64748b;}
.hr-bar-fg.cold{background:#dc2626;}

/* ── OPP CELL ── */
.opp-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.opp-name{font-size:0.75rem;font-weight:700;color:#334155;white-space:nowrap;}
.opp-tag{display:inline-block;font-size:0.62rem;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;}
.opp-tag.easy{background:rgba(16,185,129,0.11);color:#059669;border:1px solid rgba(16,185,129,0.25);}
.opp-tag.hard{background:rgba(239,68,68,0.09);color:#dc2626;border:1px solid rgba(239,68,68,0.22);}
.opp-tag.avg{background:#f1f5f9;color:#94a3b8;border:1px solid #E2E8F0;}

/* ── PICK CELL ── */
.pick-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.pick-badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:0.82rem;padding:5px 12px;border-radius:10px;white-space:nowrap;}
.pick-badge.over{background:rgba(16,185,129,0.12);color:#059669;border:1.5px solid rgba(16,185,129,0.3);}
.pick-badge.under{background:rgba(239,68,68,0.09);color:#dc2626;border:1.5px solid rgba(239,68,68,0.22);}
.pick-line-val{font-size:0.7rem;font-weight:700;opacity:0.75;}
.tier-tag{display:inline-block;font-size:0.6rem;font-weight:800;padding:1px 6px;border-radius:4px;letter-spacing:0.2px;}
.tier-tag.gold{background:rgba(245,158,11,0.14);color:#b45309;border:1px solid rgba(245,158,11,0.32);}
.tier-tag.green{background:rgba(16,185,129,0.11);color:#059669;border:1px solid rgba(16,185,129,0.26);}
.tier-tag.red{background:rgba(239,68,68,0.09);color:#dc2626;border:1px solid rgba(239,68,68,0.2);}
.tier-tag.blocked{background:rgba(100,116,139,0.14);color:#475569;border:1px solid rgba(100,116,139,0.3);}
.tier-tag.unproven{background:rgba(148,163,184,0.12);color:#64748b;border:1px solid rgba(148,163,184,0.28);}

/* ── RESULTS / DIAGNOSTICS (kept from original) ── */
.results-summary{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(15,23,42,0.06);}
.rs-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #f1f5f9;}
.rs-title{font-size:1.1rem;font-weight:800;color:#0f172a;}
.rs-date{font-size:0.82rem;color:#64748b;font-weight:600;}
.rs-tally-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.rs-tally-block{flex:1;min-width:140px;background:#f8fafc;border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px;text-align:center;}
.rs-tally-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin-bottom:6px;}
.rs-tally-pct{font-size:2rem;font-weight:900;line-height:1;margin-bottom:4px;color:#0f172a;}
.rs-tally-pct.great{color:#059669;}.rs-tally-pct.ok{color:#d97706;}.rs-tally-pct.poor{color:#dc2626;}
.rs-tally-rec{font-size:0.92rem;font-weight:700;margin-bottom:3px;}
.rs-tally-total{font-size:0.72rem;color:#94a3b8;font-weight:600;}
.rs-section-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin-bottom:8px;}
.season-prop-table{width:100%;border-collapse:collapse;margin-top:4px;}
.season-prop-table th{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8;text-align:left;padding:6px 10px;border-bottom:1px solid #f1f5f9;}
.season-prop-table th:not(:first-child){text-align:center;}
.season-prop-table td{padding:8px 10px;border-bottom:1px solid #f8fafc;font-size:0.85rem;color:#0f172a;}
.season-prop-table td:not(:first-child){text-align:center;}
.season-prop-table tr:last-child td{border-bottom:none;}
.season-prop-table tr:hover td{background:#f8fafc;}
.spt-name{font-weight:700;}.spt-pct{font-weight:800;}
.spt-pct.great{color:#059669;}.spt-pct.ok{color:#d97706;}.spt-pct.poor{color:#dc2626;}
.rec-w{color:#059669;}.rec-l{color:#dc2626;}
.result-rows{padding:4px 0;}
.result-row{display:grid;grid-template-columns:1fr 58px 68px 68px 64px;align-items:center;padding:9px 16px;border-bottom:1px solid #f8fafc;gap:6px;font-size:0.82rem;}
.result-row:last-child{border-bottom:none;}
.rr-prop{font-weight:700;color:#0f172a;}
.rr-pick{font-size:0.72rem;font-weight:800;text-align:center;padding:3px 6px;border-radius:5px;background:#f1f5f9;color:#475569;}
.rr-pick.over{background:rgba(16,185,129,0.13);color:#059669;}
.rr-pick.under{background:rgba(239,68,68,0.10);color:#dc2626;}
.rr-line,.rr-actual{color:#475569;text-align:center;}
.rr-lbl{display:block;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#94a3b8;margin-bottom:1px;}
.rr-result{font-size:0.72rem;font-weight:800;text-align:center;padding:3px 6px;border-radius:5px;background:#f1f5f9;color:#64748b;}
.rr-result.hit{background:rgba(16,185,129,0.15);color:#059669;}
.rr-result.miss{background:rgba(239,68,68,0.12);color:#dc2626;}
.player-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(15,23,42,0.07);}
.player-card-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid #f1f5f9;background:#fafbfc;}
.player-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;font-size:0.88rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.5px;}
.player-name{font-size:0.95rem;font-weight:800;color:#0f172a;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-team{font-size:0.75rem;color:#64748b;font-weight:600;margin-top:2px;}
.player-record{font-size:0.78rem;font-weight:700;margin-left:auto;white-space:nowrap;padding:4px 10px;border-radius:8px;background:#f1f5f9;border:1px solid #E2E8F0;}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
@media(max-width:680px){.player-grid{grid-template-columns:1fr;}}

/* ── RESPONSIVE COLUMN HIDING ── */
@media(max-width:1100px){.col-ev,.col-opp{display:none;}}
@media(max-width:820px){.col-conf,.col-season{display:none;}}
@media(max-width:600px){.col-l10,.col-line{display:none;}.props-table{min-width:560px;}}
</style>
{% endblock %}

{% block content %}
<div class="props-wrap">
  <div class="props-controls">
    <div class="controls-left">
      <div class="tab-group">
        <button class="tab-btn active" id="tabProps" onclick="switchTab('props')">Props</button>
        <button class="tab-btn" id="tabResults" onclick="switchTab('results')">Results</button>
        <button class="tab-btn" id="tabDiag" onclick="switchTab('diagnostics')">Model Performance</button>
      </div>
      <select class="league-sel" id="leagueSel" onchange="onLeagueChange()">
        <option value="">Select sport</option>
        <option>NBA</option><option>NHL</option><option>NFL</option>
        <option>MLB</option><option>NCAAB</option><option>WNBA</option>
        <option>NCAAF</option><option>NCAAW</option><option>SOCCER</option>
        <option value="TENNIS">TENNIS</option><option value="UFC">UFC</option><option value="GOLF">GOLF</option>
      </select>
    </div>
    <button class="load-btn" id="loadBtn" onclick="loadProps()">Load Props</button>
  </div>

  <div class="date-bubbles-wrap" id="dateBubblesWrap">
    <button class="date-nav-btn" id="datePrev" onclick="shiftWeek(-1)">&lsaquo; Prev</button>
    <div class="date-bubbles" id="dateBubbles"></div>
    <button class="date-nav-btn" id="dateNext" onclick="shiftWeek(1)">Next &rsaquo;</button>
  </div>

  <div id="propsError" class="props-error" style="display:none;"></div>
  <div id="propsContent">
    <div class="props-msg">Select a sport and click <strong>Load Props</strong> to see tonight's projections.</div>
  </div>
</div>

<script>
const MODEL_KEYS   = ['glicko2','trueskill','xgboost','xsharp','sharp_consensus'];
const MODEL_LABELS = ['Grinder2','Takedown','Edge','XSharp','Consensus'];
const PROP_LABELS  = {
  points:'Points', rebounds:'Rebounds', assists:'Assists', threes:'3PT Made',
  steals:'Steals', shots_on_goal:'SOG', goals:'Goals', hits:'H',
  strikeouts:'K', runs:'R', rbis:'RBI', home_runs:'HR',
  singles:'1B', doubles:'2B', total_bases:'TB', stolen_bases:'SB',
  earned_runs:'ER', hits_allowed:'HA', walks:'BB', outs:'OUTS',
  passing_yards:'Pass Yds', rushing_yards:'Rush Yds',
  receiving_yards:'Rec Yds', receptions:'Rec',
  shots:'Shots', shots_on_target:'On Tgt',
  aces:'Aces', games:'Games Won', double_faults:'Dbl Faults',
  significant_strikes:'Sig. Strikes', takedowns:'Takedowns',
  birdies:'Birdies', bogeys:'Bogeys',
  pts_reb:'Pts + Reb', pts_ast:'Pts + Ast', reb_ast:'Reb + Ast',
  pts_reb_ast:'Pts + Reb + Ast', h_r_rbi:'H + R + RBI'
};
const PROP_DESCRIPTIONS = {
  points:          'Points scored in the game',
  rebounds:        'Total rebounds (offensive + defensive)',
  assists:         'Assists (passes leading to a made basket)',
  threes:          '3-point shots made',
  steals:          'Steals',
  shots_on_goal:   'Shots on goal (hockey)',
  goals:           'Goals scored',
  hits:            'Hits — times a batter reaches base via a hit',
  strikeouts:      'K — Pitcher strikeouts (how many batters a pitcher strikes out)',
  runs:            'Runs scored by this player',
  rbis:            'RBI — Runs Batted In (runners the batter drives home)',
  home_runs:       'HR — Home runs hit by this player',
  singles:         '1B — Singles (one-base hits)',
  doubles:         '2B — Doubles (two-base hits)',
  total_bases:     'TB — Total Bases (1×1B + 2×2B + 3×3B + 4×HR)',
  stolen_bases:    'SB — Stolen Bases',
  earned_runs:     'ER — Earned Runs allowed (pitcher)',
  hits_allowed:    'HA — Hits Allowed (pitcher)',
  walks:           'BB — Walks allowed (pitcher)',
  outs:            'OUTS — Outs recorded by the pitcher (innings × 3)',
  passing_yards:   'Passing yards (QB only)',
  rushing_yards:   'Rushing yards (carries)',
  receiving_yards: 'Receiving yards (catches)',
  receptions:      'Receptions (catches made)',
  shots:                'Total shot attempts (soccer)',
  shots_on_target:      'Shots on target — shots that required a save or scored',
  aces:                 'Aces — unreturnable serves (per match)',
  games:                'Games Won — total games won in the match',
  double_faults:        'Double Faults — two consecutive faults losing the point',
  significant_strikes:  'Significant Strikes — clean, effective strikes landed (per fight)',
  takedowns:            'Takedowns — successful takedowns to the ground (per fight)',
  birdies:              'Birdies — holes completed in 1 under par (per round)',
  bogeys:               'Bogeys — holes completed in 1 over par (per round)',
  pts_reb:              'Points + Rebounds combined',
  pts_ast:              'Points + Assists combined',
  reb_ast:              'Rebounds + Assists combined',
  pts_reb_ast:          'Points + Rebounds + Assists combined',
  h_r_rbi:              'Hits + Runs + RBIs combined'
};

let _view = 'props';
let _selectedDate = '';
let _weekOffset = 0;
let _activePropType = 'all';
let _activeSide = 'all';
let _searchQ = '';
let _sortCol = null;
let _sortDir = 1; // 1 = asc, -1 = desc
let _allRows = [];
const DATES_PER_PAGE = 7;

/* ── Date helpers ── */
function _isoToday() { return new Date().toISOString().slice(0,10); }
function _isoYesterday() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function _resultsDefaultDate() { return _isoYesterday(); }
function _offsetDate(isoBase, days) {
  const d = new Date(isoBase+'T12:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function _fmtBubble(iso) {
  const d = new Date(iso+'T12:00:00');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+', '+mons[d.getMonth()]+' '+d.getDate();
}

function renderDateBubbles() {
  const today = _isoToday();
  const defaultResultsDate = _resultsDefaultDate();
  const wrap = document.getElementById('dateBubblesWrap');
  const container = document.getElementById('dateBubbles');
  const league = document.getElementById('leagueSel').value;
  if (!league) { wrap.classList.remove('visible'); return; }
  wrap.classList.add('visible');
  const windowEnd = _offsetDate(today, _weekOffset*DATES_PER_PAGE);
  const dates = [];
  for (let i = DATES_PER_PAGE-1; i >= 0; i--) dates.push(_offsetDate(windowEnd,-i));
  document.getElementById('datePrev').disabled = false;
  document.getElementById('dateNext').disabled = _weekOffset >= 0;
  container.innerHTML = '';
  const activeDate = _selectedDate || (_view === 'results' ? defaultResultsDate : today);
  dates.forEach(iso => {
    if (iso > today && _view === 'results') return;
    const b = document.createElement('div');
    b.className = 'date-bubble';
    if (iso === today) b.classList.add('today-bubble');
    if (iso === activeDate) b.classList.add('active');
    b.textContent = iso === today ? 'Today' : _fmtBubble(iso);
    b.dataset.iso = iso;
    b.onclick = () => { _selectedDate = iso; renderDateBubbles(); if (league) loadProps(); };
    container.appendChild(b);
  });
}

function shiftWeek(dir) {
  const newOff = _weekOffset+dir;
  if (newOff > 0) return;
  _weekOffset = newOff;
  if (!_selectedDate) _selectedDate = _view === 'results' ? _resultsDefaultDate() : _isoToday();
  const today = _isoToday();
  const windowEnd = _offsetDate(today, _weekOffset*DATES_PER_PAGE);
  for (let i = 0; i < DATES_PER_PAGE; i++) {
    const d = _offsetDate(windowEnd,-i);
    if (d <= today) { _selectedDate = d; break; }
  }
  renderDateBubbles();
  const league = document.getElementById('leagueSel').value;
  if (league) loadProps();
}

function onLeagueChange() { _selectedDate=''; _weekOffset=0; renderDateBubbles(); }

function switchTab(v) {
  _view = v;
  _selectedDate = '';
  document.getElementById('tabProps').classList.toggle('active', v==='props');
  document.getElementById('tabResults').classList.toggle('active', v==='results');
  document.getElementById('tabDiag').classList.toggle('active', v==='diagnostics');
  renderDateBubbles();
  const league = document.getElementById('leagueSel').value;
  if (league) loadProps();
}

function loadProps() {
  const league = document.getElementById('leagueSel').value;
  if (!league) return;
  const btn = document.getElementById('loadBtn');
  btn.disabled=true; btn.textContent='Loading…';
  setError('');
  setContent('<div class="props-msg">Loading…</div>');
  _activePropType='all'; _activeSide='all'; _searchQ=''; _sortCol=null;
  const dateParam = _selectedDate || (_view === 'results' ? _resultsDefaultDate() : _isoToday());
  let url;
  if (_view==='props') url=`/player-props-api/props?league=${encodeURIComponent(league)}`;
  else if (_view==='diagnostics') url=`/player-props-api/performance?league=${encodeURIComponent(league)}`;
  else url=`/player-props-api/results?league=${encodeURIComponent(league)}&date=${encodeURIComponent(dateParam)}`;
  fetch(url)
    .then(r => r.ok ? r.json() : r.json().then(d => { throw new Error(d.detail||r.statusText); }))
    .then(data => {
      btn.disabled=false; btn.textContent='Load Props';
      if (_view==='props') renderProps(data, league);
      else if (_view==='diagnostics') renderPerformance(data, league);
      else renderResults(data, league);
    })
    .catch(err => {
      btn.disabled=false; btn.textContent='Load Props';
      setError(err.message||'Props service unavailable. Please try again.');
      setContent('');
    });
}

function setError(msg) { const el=document.getElementById('propsError'); el.style.display=msg?'':'none'; el.textContent=msg; }
function setContent(html) { document.getElementById('propsContent').innerHTML=html; }
function fmt(pt) { return PROP_LABELS[pt]||pt.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function fmtWithTip(pt) {
  const label = fmt(pt);
  const desc  = PROP_DESCRIPTIONS[pt];
  if (!desc) return `<span class="prop-type-tag">${label}</span>`;
  return `<span class="prop-tooltip-wrap">
    <span class="prop-type-tag">${label}</span>
    <button class="prop-info-btn" title="${desc}" aria-label="${desc}">ℹ</button>
    <span class="prop-tooltip-box">${desc}</span>
  </span>`;
}
function initials(name) { return (name||'').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase(); }
function pct(w,l) { return (w+l)>0?Math.round(w/(w+l)*100):0; }
function rec(w,l) { return `<span class="rec-w">${w}</span>–<span class="rec-l">${l}</span>`; }
function rateClass(r) { return r>=60?'great':r>=50?'ok':'poor'; }

/* ── Hit rate helpers ── */
function hrClass(v) {
  if (v == null) return 'na';
  return v >= 65 ? 'hot' : v >= 40 ? 'warm' : 'cold';
}
// Show the real game-log record (e.g. "2/5") with the % as a small subscript.
function hrCell(v, record) {
  if (v == null || !record || !record[1]) {
    return `<div class="hr-wrap"><span class="hr-pct na">—</span></div>`;
  }
  const cls = hrClass(v);
  const hits = record[0], n = record[1];
  return `<div class="hr-wrap">
    <span class="hr-pct ${cls}">${hits}/${n}</span>
    <span style="font-size:0.6rem;color:#94a3b8;font-weight:700;">${v}%</span>
    <div class="hr-bar-bg"><div class="hr-bar-fg ${cls}" style="width:${v}%"></div></div>
  </div>`;
}

/* ── Opp factor badge ── */
function oppCell(row) {
  const opp = row.opponent || '';
  const rawVenue = String(row.venue || row.home_away || row.location || '').toLowerCase();
  let venue = rawVenue.includes('away') || rawVenue === '@' ? 'Away'
            : rawVenue.includes('home') ? 'Home' : '';
  if (!venue) {
    const matchup = String(row.matchup || row.game || '').toLowerCase();
    const team = String(row.team || '').toLowerCase();
    if (matchup && team) {
      if (matchup.includes('@') && matchup.indexOf(team) > matchup.indexOf('@')) venue = 'Home';
      else if (matchup.includes('@')) venue = 'Away';
    }
  }
  if (!opp && !venue) return '—';
  let tag = '';
  if (venue === 'Home') tag = `<span class="opp-tag easy">Home</span>`;
  else if (venue === 'Away') tag = `<span class="opp-tag hard">Away</span>`;
  return `<div class="opp-wrap">${opp ? `<span class="opp-name">${venue === 'Away' ? '@' : 'vs'} ${opp}</span>` : ''}${tag}</div>`;
}

/* ── EV cell ── */
function evCell(ev) {
  if (ev == null) return '<span class="ev-val neu">—</span>';
  const cls = ev >= 2 ? 'pos' : ev < 0 ? 'neg' : 'neu';
  return `<span class="ev-val ${cls}">${ev>0?'+':''}${ev}%</span>`;
}

/* ── Render Props Table ── */
function renderProps(data, league) {
  _allRows = data.items || [];
  if (!_allRows.length) { setContent(`<div class="props-msg">No props available for ${league} right now.</div>`); return; }

  // Build prop type pills
  const propTypes = [...new Set(_allRows.map(r => r.prop_type))];

  const today = _isoToday();
  const d = new Date(today+'T12:00:00');
  const dateStr = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // Approved / blocked category banner from the calibration layer
  const approved = data.approved_categories || [];
  const blocked  = data.blocked_categories  || [];
  const goldCount = data.gold_count;
  let banner = '';
  if (approved.length || blocked.length) {
    const appPills = approved.map(p=>`<span style="display:inline-block;background:rgba(16,185,129,0.12);color:#059669;border:1px solid rgba(16,185,129,0.3);border-radius:6px;padding:2px 8px;font-size:0.72rem;font-weight:700;margin:2px;">${fmt(p)}</span>`).join('');
    const blkPills = blocked.map(p=>`<span style="display:inline-block;background:rgba(239,68,68,0.09);color:#dc2626;border:1px solid rgba(239,68,68,0.25);border-radius:6px;padding:2px 8px;font-size:0.72rem;font-weight:700;margin:2px;">${fmt(p)}</span>`).join('');
    banner = `<div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(15,23,42,0.05);">
      ${approved.length?`<div style="margin-bottom:${blocked.length?'8px':'0'};"><span style="font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#059669;">✓ Approved categories</span><div style="margin-top:4px;">${appPills}</div></div>`:''}
      ${blocked.length?`<div><span style="font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#dc2626;">⛔ Blocked (NO BET ZONE)</span><div style="margin-top:4px;">${blkPills}</div><div style="font-size:0.7rem;color:#94a3b8;margin-top:4px;">Blocked = below 45% over a full sample, or not enough graded games to trust yet.</div></div>`:''}
      ${goldCount===0?`<div style="margin-top:8px;font-size:0.78rem;font-weight:700;color:#b45309;">★ No Gold props today — nothing met the validated-edge + EV + confidence bar.</div>`:(goldCount>0?`<div style="margin-top:8px;font-size:0.78rem;font-weight:700;color:#b45309;">★ ${goldCount} Gold prop${goldCount>1?'s':''} from approved categories</div>`:'')}
    </div>`;
  }

  let html = `
  <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
    <div>
      <div style="font-size:1.4rem;font-weight:900;color:#0f172a;line-height:1.2;">${league} Prop Bet Cheat Sheet</div>
      <div style="font-size:0.82rem;color:#64748b;font-weight:600;margin-top:3px;">Best ${league} Props for ${dateStr}</div>
    </div>
  </div>
  ${banner}
  <div class="prop-filter-wrap">
    <div class="prop-filter-row" id="propTypePills">
      <button class="prop-filter-btn active" data-pt="all" onclick="_pfType(this,'all')">All</button>
      ${propTypes.map(pt=>{const d=PROP_DESCRIPTIONS[pt]||'';return `<button class="prop-filter-btn" data-pt="${pt}" onclick="_pfType(this,'${pt}')" title="${d}">${fmt(pt)}${d?' <span style="opacity:.55;font-size:.68em;">ℹ</span>':''}</button>`;}).join('')}
    </div>
  </div>
  <div class="props-toolbar" id="propsToolbar">
    <input class="pt-search" type="text" placeholder="Search players…" oninput="_onSearch(this.value)" id="playerSearch">
    <div class="side-filter-grp">
      <button class="side-btn active-all" id="sideAll" onclick="_pfSide('all')">All</button>
      <button class="side-btn" id="sideOver" onclick="_pfSide('over')">Over</button>
      <button class="side-btn" id="sideUnder" onclick="_pfSide('under')">Under</button>
    </div>
    <button class="copy-all-btn" id="copyAllBtn" onclick="copyAllProps()" title="Copy all visible props to clipboard">📋 Copy All</button>
    <span class="pt-count" id="propCount">${_allRows.length} props</span>
  </div>
  <div class="props-table-outer">
    <table class="props-table" id="propsTable">
      <thead>
        <tr>
          <th class="no-sort">Player</th>
          <th onclick="_sortBy('prop_type',this)">Prop</th>
          <th class="col-line" onclick="_sortBy('_calc_line',this)">Line</th>
          <th onclick="_sortBy('projection',this)">Proj.</th>
          <th onclick="_sortBy('_diff',this)">Diff</th>
          <th class="col-conf" onclick="_sortBy('confidence_score',this)">Conf</th>
          <th class="col-ev" onclick="_sortBy('pick_ev',this)">EV</th>
          <th class="col-opp no-sort">Opp</th>
          <th onclick="_sortBy('l5_hit_rate',this)">L-5</th>
          <th class="col-l10" onclick="_sortBy('l10_hit_rate',this)">L-10</th>
          <th class="col-season" onclick="_sortBy('season_hit_rate',this)">Season</th>
          <th class="no-sort">Pick</th>
        </tr>
      </thead>
      <tbody id="propsTableBody"></tbody>
    </table>
  </div>
  <div style="display:flex;justify-content:center;margin:16px 0 4px;">
    <button class="copy-all-btn" onclick="copyAllProps()" title="Copy all visible props to clipboard" style="margin-left:0;">📋 Copy All</button>
  </div>`;
  setContent(html);
  _renderTableRows();

  window._pfType = function(btn, pt) {
    _activePropType = pt;
    document.querySelectorAll('#propTypePills .prop-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.pt === pt));
    _renderTableRows();
  };
  window._pfSide = function(side) {
    _activeSide = side;
    document.getElementById('sideAll').classList.toggle('active-all', side==='all');
    document.getElementById('sideOver').classList.toggle('active-over', side==='over');
    document.getElementById('sideUnder').classList.toggle('active-under', side==='under');
    _renderTableRows();
  };
  window._onSearch = function(q) { _searchQ = q.toLowerCase(); _renderTableRows(); };
  window._sortBy = function(col, th) {
    if (_sortCol === col) _sortDir *= -1;
    else { _sortCol=col; _sortDir=-1; }
    document.querySelectorAll('.props-table thead th').forEach(t => { t.classList.remove('sorted-asc','sorted-desc'); });
    if (th) th.classList.add(_sortDir===-1?'sorted-desc':'sorted-asc');
    _renderTableRows();
  };
}

function _renderTableRows() {
  let rows = _allRows.slice();

  // Augment with diff
  rows.forEach(r => {
    const proj = r.projection ?? 0;
    const line = r._calc_line ?? r.line ?? 0;
    r._diff = proj - line;
  });

  // Filter: prop type
  if (_activePropType !== 'all') rows = rows.filter(r => r.prop_type === _activePropType);
  // Filter: side
  if (_activeSide !== 'all') rows = rows.filter(r => (r.picked_side||'').toLowerCase() === _activeSide);
  // Filter: search
  if (_searchQ) rows = rows.filter(r => (r.player_name||'').toLowerCase().includes(_searchQ));

  // Sort
  if (_sortCol) {
    rows.sort((a,b) => {
      let av = a[_sortCol], bv = b[_sortCol];
      if (av == null) av = _sortDir===1 ? Infinity : -Infinity;
      if (bv == null) bv = _sortDir===1 ? Infinity : -Infinity;
      if (typeof av === 'string') return av.localeCompare(bv) * _sortDir;
      return (av - bv) * _sortDir;
    });
  }

  // Update count
  const countEl = document.getElementById('propCount');
  if (countEl) countEl.textContent = `${rows.length} prop${rows.length!==1?'s':''}`;

  // Build rows HTML
  let html = '';
  for (const r of rows) {
    const side = (r.picked_side||'').toLowerCase();
    const proj = r.projection ?? '—';
    const line = r._calc_line ?? r.line ?? '—';
    const diff = r._diff;
    const diffStr = diff != null ? (diff>0?'+':'')+diff.toFixed(1) : '—';
    const diffCls = diff > 0.3 ? 'pos' : diff < -0.3 ? 'neg' : 'neu';
    const projCls = side==='over' ? 'up' : side==='under' ? 'down' : '';
    const conf = r.confidence_score ?? null;
    const confCls = conf>=65?'great':conf>=55?'ok':'poor';
    const ev = r.pick_ev ?? null;
    const tier = r.tier || 'neutral';
    const tierLabel = tier==='gold'?'★ Gold':tier==='green'?'+ Edge':tier==='red'?'− Fade'
                     :tier==='blocked'?'⛔ NO BET':tier==='unproven'?'· Unproven':'';
    const rowAttr = (r.blocked || tier==='blocked' || tier==='unproven') ? ' style="opacity:0.55;"' : '';

    html += `<tr${rowAttr}>`+`
      <td>
        <div class="td-player">
          <div class="p-avatar">${initials(r.player_name)}</div>
          <div>
            <div class="p-name">${r.player_name||'—'}</div>
            <div class="p-sub">${r.team||''}${r.opponent?' · vs '+r.opponent:''}</div>
          </div>
        </div>
      </td>
      <td>${fmtWithTip(r.prop_type)}</td>
      <td class="col-line td-line">${typeof line==='number'?line.toFixed(1):line}</td>
      <td class="td-proj ${projCls}">${typeof proj==='number'?proj.toFixed(1):proj}</td>
      <td><span class="diff-badge ${diffCls}">${diffStr}</span></td>
      <td class="col-conf">
        <div class="conf-wrap">
          <span class="conf-pct">${conf!=null?conf+'%':'—'}</span>
          <div class="conf-bar-bg"><div class="conf-bar-fg ${confCls}" style="width:${conf??0}%"></div></div>
        </div>
      </td>
      <td class="col-ev">${evCell(ev)}</td>
      <td class="col-opp">${oppCell(r)}</td>
      <td>${hrCell(r.l5_hit_rate, r.l5_record)}</td>
      <td class="col-l10">${hrCell(r.l10_hit_rate, r.l10_record)}</td>
      <td class="col-season">${hrCell(r.season_hit_rate, r.season_record)}</td>
      <td>
        <div class="pick-wrap">
          <span class="pick-badge ${side}">
            ${side.toUpperCase()}
            <span class="pick-line-val">${typeof line==='number'?line.toFixed(1):line}</span>
          </span>
          ${tierLabel?`<span class="tier-tag ${tier}">${tierLabel}</span>`:''}
        </div>
      </td>
    </tr>`;
  }
  const tbody = document.getElementById('propsTableBody');
  if (tbody) tbody.innerHTML = html || `<tr><td colspan="12" style="text-align:center;padding:40px;color:#64748b;">No props match your filters.</td></tr>`;
}

/* ── Copy All: build a clean tab-separated table of the currently shown props ── */
function _visiblePropRows() {
  let rows = _allRows.slice();
  rows.forEach(r => { r._diff = (r.projection ?? 0) - (r._calc_line ?? r.line ?? 0); });
  if (_activePropType !== 'all') rows = rows.filter(r => r.prop_type === _activePropType);
  if (_activeSide !== 'all') rows = rows.filter(r => (r.picked_side||'').toLowerCase() === _activeSide);
  if (_searchQ) rows = rows.filter(r => (r.player_name||'').toLowerCase().includes(_searchQ));
  if (_sortCol) {
    rows.sort((a,b)=>{let av=a[_sortCol],bv=b[_sortCol];
      if(av==null)av=_sortDir===1?Infinity:-Infinity; if(bv==null)bv=_sortDir===1?Infinity:-Infinity;
      return (typeof av==='string')?av.localeCompare(bv)*_sortDir:(av-bv)*_sortDir;});
  }
  return rows;
}
function _rec(r){ return (r&&r[1])?`${r[0]}/${r[1]}`:'—'; }
function copyAllProps() {
  const rows = _visiblePropRows();
  if (!rows.length) return;
  const header = ['Player','Team','Opp','Prop','Line','Proj','Diff','Conf','EV','L-5','L-10','Season','Pick'];
  const lines = [header.join('\t')];
  for (const r of rows) {
    const line = r._calc_line ?? r.line ?? '';
    const proj = r.projection ?? '';
    const diff = (typeof r._diff==='number') ? (r._diff>0?'+':'')+r._diff.toFixed(2) : '';
    const ev = (r.pick_ev!=null) ? (r.pick_ev>0?'+':'')+r.pick_ev+'%' : '';
    lines.push([
      r.player_name||'', r.team||'', r.opponent||'', fmt(r.prop_type),
      line, proj, diff,
      (r.confidence_score!=null?r.confidence_score+'%':''),
      ev, _rec(r.l5_record), _rec(r.l10_record), _rec(r.season_record),
      (r.picked_side||'')+' '+line
    ].join('\t'));
  }
  const text = lines.join('\n');
  const btn = document.getElementById('copyAllBtn');
  const done = ok => { if(!btn) return; const o=btn.textContent; btn.textContent=ok?'✓ Copied!':'Copy failed'; btn.classList.toggle('copied',ok); setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(false));
  } else {
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    let ok=false; try{ok=document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(ok);
  }
}

/* ── Historical Model Performance (user-facing; replaces internal diagnostics) ── */
function _roiColor(v){ return v==null?'#94a3b8':v>0?'#059669':v<0?'#dc2626':'#64748b'; }
function _wrColor(v){ return v==null?'#94a3b8':v>=55?'#059669':v>=50?'#d97706':'#dc2626'; }
function _perfRows(table){
  return table.map(b=>{
    const wr=b.win_rate, roi=b.roi;
    const dim = b.sample<10 ? ' style="opacity:0.5;"' : '';
    return `<tr${dim}>
      <td style="padding:8px 10px;font-weight:700;color:#0f172a;">${b.bucket}</td>
      <td style="padding:8px 10px;text-align:center;font-weight:800;color:${_wrColor(wr)};">${wr==null?'—':wr+'%'}</td>
      <td style="padding:8px 10px;text-align:center;color:#475569;">${b.record}${b.sample<10&&b.sample>0?' <span style="font-size:0.7em;color:#94a3b8;">(small)</span>':''}</td>
      <td style="padding:8px 10px;text-align:center;font-weight:700;color:${_roiColor(roi)};">${roi==null?'—':(roi>0?'+':'')+roi+'%'}</td>
    </tr>`;
  }).join('');
}
function renderPerformance(data, league) {
  if (data.error) { setContent(`<div class="props-msg">${data.detail||data.error}</div>`); return; }
  const t = data.today||{};
  const lt = data.lifetime||{}, l100 = data.last_100||{}, l500 = data.last_500||{};
  const cm = data.today_conf_match, em = data.today_ev_match;

  // "Today's Card" — connect today's averages to historical results
  let todayCard = '';
  if (t.total) {
    const confLine = (cm && cm.sample>=10)
      ? `Historically, predictions in the <strong>${data.today_conf_bucket}</strong> confidence bucket have won <strong>${cm.win_rate}%</strong> across <strong>${cm.sample}</strong> completed picks (ROI ${cm.roi>0?'+':''}${cm.roi}%).`
      : `Not enough graded history yet in the <strong>${data.today_conf_bucket}</strong> confidence bucket to show a reliable win rate.`;
    const evLine = (em && em.sample>=10)
      ? `Historically, predictions with <strong>${data.today_ev_bucket}</strong> expected value have produced a <strong>${em.roi>0?'+':''}${em.roi}% ROI</strong> across <strong>${em.sample}</strong> completed picks.`
      : `Not enough graded history yet in the <strong>${data.today_ev_bucket}</strong> EV bucket to show a reliable ROI.`;
    todayCard = `<div class="results-summary" style="border-left:4px solid #2563eb;">
      <div style="font-size:0.95rem;font-weight:800;color:#0f172a;margin-bottom:10px;">Today's Card</div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px;">
        <div><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Total Picks</div><div style="font-size:1.5rem;font-weight:900;color:#0f172a;">${t.total}</div></div>
        <div><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Avg Confidence</div><div style="font-size:1.5rem;font-weight:900;color:#0f172a;">${t.avg_conf!=null?t.avg_conf+'%':'—'}</div></div>
        <div><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Avg Expected Value</div><div style="font-size:1.5rem;font-weight:900;color:${t.avg_ev>0?'#059669':'#64748b'};">${t.avg_ev!=null?(t.avg_ev>0?'+':'')+t.avg_ev+'%':'—'}</div></div>
      </div>
      <p style="color:#334155;font-size:0.86rem;line-height:1.6;margin:0 0 6px;">${confLine}</p>
      <p style="color:#334155;font-size:0.86rem;line-height:1.6;margin:0;">${evLine}</p>
    </div>`;
  }

  // Lifetime / last-N strip
  const summaryStrip = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;">
    <div class="results-summary"><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Last 100 Picks</div><div style="font-size:1.2rem;font-weight:900;color:#0f172a;">${l100.sample>=10?l100.record:'—'}</div><div style="font-size:0.78rem;font-weight:700;color:${_roiColor(l100.roi)};">${l100.sample>=10?(l100.roi>0?'+':'')+l100.roi+'% ROI':'building sample'}</div></div>
    <div class="results-summary"><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Last 500 Picks</div><div style="font-size:1.2rem;font-weight:900;color:#0f172a;">${l500.sample>=10?l500.record:'—'}</div><div style="font-size:0.78rem;font-weight:700;color:${_roiColor(l500.roi)};">${l500.sample>=10?(l500.roi>0?'+':'')+l500.roi+'% ROI':'building sample'}</div></div>
    <div class="results-summary"><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Lifetime Record</div><div style="font-size:1.2rem;font-weight:900;color:#0f172a;">${lt.sample>=10?lt.record:'—'}</div><div style="font-size:0.78rem;font-weight:700;color:${_wrColor(lt.win_rate)};">${lt.sample>=10?lt.win_rate+'%':'building sample'}</div></div>
    <div class="results-summary"><div style="font-size:0.7rem;color:#64748b;text-transform:uppercase;font-weight:700;">Lifetime ROI</div><div style="font-size:1.2rem;font-weight:900;color:${_roiColor(lt.roi)};">${lt.sample>=10?(lt.roi>0?'+':'')+lt.roi+'%':'—'}</div><div style="font-size:0.78rem;color:#94a3b8;">${data.graded} graded</div></div>
  </div>`;

  const tableHead = `<thead><tr style="background:#f8fafc;">
    <th style="padding:8px 10px;text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;">Bucket</th>
    <th style="padding:8px 10px;text-align:center;font-size:0.68rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;">Win Rate</th>
    <th style="padding:8px 10px;text-align:center;font-size:0.68rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;">Record</th>
    <th style="padding:8px 10px;text-align:center;font-size:0.68rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;">ROI</th>
  </tr></thead>`;

  setContent(`<div style="max-width:820px;margin:0 auto;padding:4px 0;">
    <div style="font-size:1.3rem;font-weight:900;color:#0f172a;margin-bottom:4px;">${league} — Historical Model Performance</div>
    <div style="font-size:0.82rem;color:#64748b;margin-bottom:18px;">How our model has performed on completed picks, by confidence and expected value. ${data.graded<10?'<strong>Tracking is still building a sample</strong> — numbers fill in as picks are graded.':''}</div>
    ${todayCard}
    <div style="height:14px;"></div>
    ${summaryStrip}
    <div class="results-summary">
      <div style="font-size:0.9rem;font-weight:800;color:#0f172a;margin-bottom:10px;">Performance by Confidence</div>
      <table style="width:100%;border-collapse:collapse;font-size:0.84rem;">${tableHead}<tbody>${_perfRows(data.confidence_table||[])}</tbody></table>
    </div>
    <div style="height:14px;"></div>
    <div class="results-summary">
      <div style="font-size:0.9rem;font-weight:800;color:#0f172a;margin-bottom:10px;">Performance by Expected Value</div>
      <table style="width:100%;border-collapse:collapse;font-size:0.84rem;">${tableHead}<tbody>${_perfRows(data.ev_table||[])}</tbody></table>
    </div>
  </div>`);
}

/* ── Results (unchanged) ── */
function renderResults(data, league) {
  const groups = groupResultsByPlayer(data.items||[]);
  const summary=data.summary||{};
  const overall=summary.overall||{};
  const week=data.week_summary||{};
  const season=data.season_summary||{};
  let dateLabel=data.result_date||'';
  if (dateLabel) { const d=new Date(dateLabel+'T12:00:00'); dateLabel=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
  const nightW=overall.wins||0,nightL=overall.losses||0,nightPct=pct(nightW,nightL);
  const weekW=week.wins||0,weekL=week.losses||0,weekPct=pct(weekW,weekL);
  const seasW=season.wins||0,seasL=season.losses||0,seasPct=pct(seasW,seasL);
  let sinceLabel='All Tracked';
  if (data.tracking_since) { const ts=new Date(data.tracking_since+'T12:00:00'); sinceLabel='Since '+ts.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
  const lastNightDate = data.last_night_date || _resultsDefaultDate();
  const nightLabel = (data.result_date === lastNightDate) ? 'Last Night' : _fmtBubble(data.result_date || lastNightDate);
  let html=`<div class="results-summary">
    <div class="rs-head"><div class="rs-title">${league} Props — Performance &amp; Results</div>${dateLabel?`<div class="rs-date">${dateLabel}</div>`:''}</div>
    <div class="rs-tally-row">
      <div class="rs-tally-block"><div class="rs-tally-label">${nightLabel}</div><div class="rs-tally-pct ${rateClass(nightPct)}">${nightPct}%</div><div class="rs-tally-rec">${rec(nightW,nightL)}</div><div class="rs-tally-total">${nightW+nightL} props graded</div></div>
      <div class="rs-tally-block"><div class="rs-tally-label">Last 7 Days</div><div class="rs-tally-pct ${rateClass(weekPct)}">${weekPct}%</div><div class="rs-tally-rec">${rec(weekW,weekL)}</div><div class="rs-tally-total">${weekW+weekL} props graded</div></div>
      <div class="rs-tally-block"><div class="rs-tally-label">${sinceLabel}</div><div class="rs-tally-pct ${rateClass(seasPct)}">${seasPct}%</div><div class="rs-tally-rec">${rec(seasW,seasL)}</div><div class="rs-tally-total">${seasW+seasL} total graded</div></div>
    </div>`;
  const seasonByProp=data.season_by_prop||{};
  const sbpEntries=Object.entries(seasonByProp);
  if (sbpEntries.length) {
    html+=`<div class="rs-section-label" style="margin-top:16px;">${sinceLabel} — By Prop Type</div>
    <table class="season-prop-table"><thead><tr><th>Prop</th><th>Hit %</th><th>Record</th><th>Graded</th></tr></thead><tbody>`;
    for (const [pt,r] of sbpEntries) {
      const total=r.wins+r.losses;
      const status=r.status||'';
      let pctCell, rowStyle='';
      if (status==='insufficient') {
        // Never show 0%/100% on a tiny sample — honest label instead.
        pctCell=`<span style="color:#94a3b8;font-weight:700;font-size:0.78rem;">INSUFFICIENT DATA</span>`;
        rowStyle=' style="opacity:0.7;"';
      } else if (status==='blocked') {
        const ptPct=(r.accuracy!=null?r.accuracy:pct(r.wins,r.losses));
        pctCell=`<span class="spt-pct poor">${ptPct}%</span> <span style="font-size:0.62rem;font-weight:800;color:#dc2626;background:rgba(239,68,68,0.1);padding:1px 6px;border-radius:4px;">NO BET</span>`;
      } else {
        const ptPct=(r.accuracy!=null?r.accuracy:pct(r.wins,r.losses));
        const ci=(r.ci_low!=null)?` <span title="95% confidence lower bound" style="font-size:0.66rem;color:#94a3b8;">(≥${r.ci_low}%)</span>`:'';
        pctCell=`<span class="spt-pct ${rateClass(ptPct)}">${ptPct}%</span>${ci}`;
      }
      html+=`<tr${rowStyle}><td class="spt-name">${fmt(pt)}</td><td>${pctCell}</td><td>${rec(r.wins,r.losses)}</td><td style="color:#94a3b8;font-size:0.8rem;">${total}${total<(r.min_samples||25)?' / '+(r.min_samples||25):''}</td></tr>`;
    }
    html+=`</tbody></table>`;
  }
  html+=`</div>`;
  if (!groups.length) { html+=`<div class="props-msg">No graded props for this date yet. Check back after games complete.</div>`; setContent(html); return; }
  const allPropTypes=[...new Set(data.items.map(r=>r.prop_type))];
  let _activePropFilter='all';
  function renderFilteredCards(filter) {
    _activePropFilter=filter;
    document.querySelectorAll('.prop-filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.pt===filter));
    const cardWrap=document.getElementById('propResultCards');
    if (!cardWrap) return;
    let cards='';
    for (const p of groups) {
      const vis=filter==='all'?p.results:p.results.filter(r=>r.prop_type===filter);
      if (!vis.length) continue;
      const fH=vis.filter(r=>r.result==='HIT').length,fM=vis.filter(r=>r.result==='MISS').length;
      cards+=`<div class="player-card"><div class="player-card-hdr"><div class="player-avatar">${initials(p.player_name)}</div><div style="flex:1;min-width:0;"><div class="player-name">${p.player_name}</div><div class="player-team">${p.team||''}</div></div><div class="player-record">${rec(fH,fM)}</div></div><div class="result-rows">`;
      for (const r of vis) {
        const isHit=r.result==='HIT',pick=(r.pick||'').toLowerCase();
        cards+=`<div class="result-row"><div class="rr-prop">${fmt(r.prop_type)}</div><div class="rr-pick ${pick}">${r.pick||'—'}</div><div class="rr-line"><span class="rr-lbl">Line</span>${r.line??'—'}</div><div class="rr-actual"><span class="rr-lbl">Actual</span>${r.actual??'—'}</div><div class="rr-result ${isHit?'hit':'miss'}">${isHit?'HIT ✓':'MISS ✗'}</div></div>`;
      }
      cards+=`</div></div>`;
    }
    cardWrap.innerHTML=cards||`<div class="props-msg" style="grid-column:1/-1;">No ${fmt(filter)} props graded for this date.</div>`;
  }
  let filterHtml=`<div class="prop-filter-row"><button class="prop-filter-btn active" data-pt="all" onclick="window._pfClick(this,'all')">All Props</button>`;
  for (const pt of allPropTypes) filterHtml+=`<button class="prop-filter-btn" data-pt="${pt}" onclick="window._pfClick(this,'${pt}')">${fmt(pt)}</button>`;
  filterHtml+=`</div>`;
  html+=filterHtml+`<div class="player-grid" id="propResultCards"></div>
  <div style="display:flex;justify-content:center;margin:16px 0 4px;">
    <button class="copy-all-btn" onclick="copyAllPropResults()" title="Copy all visible prop results to clipboard" style="margin-left:0;">📋 Copy All</button>
  </div>`;
  setContent(html);
  window._pfClick=function(btn,pt){ renderFilteredCards(pt); };
  window.copyAllPropResults=function(){
    const items=(data.items||[]).filter(r=>_activePropFilter==='all'||r.prop_type===_activePropFilter);
    if(!items.length)return;
    const header=['Player','Team','Prop','Pick','Line','Actual','Result','Date'];
    const lines=[header.join('\t')];
    for(const r of items){
      lines.push([r.player_name||'',r.team||'',fmt(r.prop_type),r.pick||'',r.line??'',r.actual??'',r.result||'',data.result_date||''].join('\t'));
    }
    const text=lines.join('\n');
    const btns=document.querySelectorAll('.copy-all-btn');
    const done=ok=>btns.forEach(btn=>{const o=btn.getAttribute('data-orig-text')||btn.textContent;btn.setAttribute('data-orig-text',o);btn.textContent=ok?'✓ Copied!':'Copy failed';btn.classList.toggle('copied',ok);setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},1600);});
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(false));}
    else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done(ok);}
  };
  renderFilteredCards('all');
}

function groupResultsByPlayer(items) {
  const map=new Map();
  for (const r of items) {
    const k=r.player_id||r.player_name;
    if (!map.has(k)) map.set(k,{player_id:k,player_name:r.player_name,team:r.team,results:[],hits:0,misses:0});
    const g=map.get(k);
    g.results.push(r);
    if (r.result==='HIT') g.hits++;
    else if (r.result==='MISS') g.misses++;
  }
  return [...map.values()];
}

document.addEventListener('DOMContentLoaded', () => {
  fetch('/player-props-api/leagues')
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data || !Array.isArray(data.leagues)) return;
      const sel = document.getElementById('leagueSel');
      if (!sel) return;
      const have = new Set([...sel.options].map(o => (o.value || o.textContent || '').toUpperCase()));
      for (const lg of data.leagues) {
        const key = String(lg || '').toUpperCase();
        if (!key || have.has(key)) continue;
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key;
        sel.appendChild(opt);
        have.add(key);
      }
    })
    .catch(() => {});
});
</script>
